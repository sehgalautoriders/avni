[package]
name = "avni-drive-scanner"
description = "AVNI Drive Scanner — scan every drive, evaluate every file, act by click"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "avni_drive_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1.0.104"
avni-scan = { path = "../../engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
